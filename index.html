<!-- template.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
<script defer src="main.js"></script></head>
<body>
    <div class="sidebar">
        <h1>TO DO LIST</h1>
        <button type="button" id="addProj">Add Project</button>
        <h2>My Projects</h3>
        
        <div class="projectList"></div>
    </div>

    <div class="main">
        <div class="titleBar"></div>
        <div class="taskContent"></div>
    </div>


    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Project Title</h2>
            <form id="myForm">
                
                <input type="text" id="projTitle" name="projTitle" required><br><br>
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>

    <div id="taskModal" class="taskModal">
        <div class="taskModal-content">
            <span class="taskClose">&times;</span>
            <h2>Task</h2>
            <form id="taskForm">
                <label for="taskTitle">Title</label><br>
                <input type="text" id="taskTitle" name="taskTitle" required><br>

                <label for="taskDesc">Description</label><br>
                <input type="text" id="taskDesc" name="taskDesc" required><br>

                <label for="prio">Priority</label><br>
                <select id="prio" name="prio">
                    <option value="high">High</option>
                    <option value="moderate">Moderate</option>
                    <option value="low">Low</option>
                </select><br>

                <label for="deadline">Deadline</label><br>
                <input type="datetime-local" id="deadline" name="meeting"><br><br>
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>
    
</body>
</html>
